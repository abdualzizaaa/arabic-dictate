name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (pytest)
        run: pytest tests/unit -q

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,windows]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Import smoke (Windows modules)
        run: python -c "import arabic_dictate.daemon, arabic_dictate.audio, arabic_dictate.inject, arabic_dictate.hotkey, arabic_dictate.ipc, arabic_dictate.tray, arabic_dictate.win_input, arabic_dictate.win_hotkey, arabic_dictate.win_audio, arabic_dictate.win_tray; print('windows imports ok')"
      - name: Unit tests (pytest)
        run: pytest tests/unit -q
